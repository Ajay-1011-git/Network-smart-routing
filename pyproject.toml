[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartroute-ai"
version = "0.1.0"
description = "Reproducible packet-network routing and demand forecasting laboratory"
requires-python = ">=3.12,<3.13"
dependencies = ["simpy==4.1.1", "networkx", "numpy", "pandas", "scikit-learn", "joblib", "streamlit", "plotly"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
smartroute = "smartroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"smartroute._vendor.ns_py" = ["LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
exclude = ["starter", "src/smartroute/_vendor", "src/smartroute/contracts.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

